<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunrise/Sunset Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Sunlight Times Dashboard</h1>
        <p>Discover sunrise and sunset times for locations worldwide</p>
    </header>
    
    <main>
        <section class="controls">
            <div class="search-container">
                <select id="location-select" class="location-select">
                    <option value="" disabled selected>Select a location</option>
                    <option value="41.8781,-87.6298">Chicago, IL</option>
                    <option value="40.7128,-74.0060">New York, NY</option>
                    <option value="34.0522,-118.2437">Los Angeles, CA</option>
                    <option value="51.5074,-0.1278">London, UK</option>
                    <option value="35.6762,139.6503">Tokyo, Japan</option>
                    <option value="-33.8688,151.2093">Sydney, Australia</option>
                    <option value="48.8566,2.3522">Paris, France</option>
                    <option value="-22.9068,-43.1729">Rio de Janeiro, Brazil</option>
                    <option value="-33.9249,18.4241">Cape Town, South Africa</option>
                    <option value="19.0760,72.8777">Mumbai, India</option>
                </select>
                <button id="search-btn" class="btn">Get Times</button>
            </div>
        </section>
        
        <section class="dashboard">
            <div class="today card">
                <h2><i class="fas fa-calendar-day"></i> Today</h2>
                <div class="data-grid">
                    <!-- Today's data will be inserted here by JS -->
                </div>
            </div>
            
            <div class="tomorrow card">
                <h2><i class="fas fa-calendar-plus"></i> Tomorrow</h2>
                <div class="data-grid">
                    <!-- Tomorrow's data will be inserted here by JS -->
                </div>
            </div>
        </section>
        
        <div id="error-message" class="error-message hidden"></div>
    </main>
    
    <footer>
        <p>Data provided by <a href="https://sunrisesunset.io/api/" target="_blank">Sunrise Sunset API</a></p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
